services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocabminer-coursework-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ApplyMigrations: ${ApplyMigrations:-true}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=vocabminer_coursework;Username=vocabminer;Password=vocabminer123}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: vocabminer-coursework-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocabminer_coursework}
      POSTGRES_USER: ${POSTGRES_USER:-vocabminer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocabminer123}
    volumes:
      - vocabminer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vocabminer} -d ${POSTGRES_DB:-vocabminer_coursework}"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: vocabminer-coursework-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-vocabminer.savoliukk.pp.ua}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  vocabminer_postgres_data:
  caddy_data:
  caddy_config:
